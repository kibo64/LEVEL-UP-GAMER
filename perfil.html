<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - LEVEL-UP GAMER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {
            --font-press: "Press Start 2P", cursive;
            --font-exo: "Exo 2", sans-serif;
        }
    </style>
</head>

<body class="text-[#4CC9F0] font-exo bg-[#5A189A]">

    <div class="bg-[#3C096C] p-4">
        <header class="flex justify-between items-center">
            <a href="perfil.html">
                Perfil
            </a>
            <h1 class="text-[#F72585] font-press">
                LEVEL-UP GAMER
            </h1>
            <a href="index.html"
                class="bg-[#240046] rounded-xl shadow-sm shadow-[#4CC9F0]/50 p-2 text-sm hover:shadow-[#4CC9F0] hover:shadow-md transition-all duration-200">
                Cerrar sesión
            </a>
        </header>
    </div>

    <div>
        <section class="lg:w-[800px] lg:m-auto md:w-[600px] md:m-auto">
            <form id="perfilForm"
                class="mt-5 mx-4 rounded-xl overflow-hidden shadow-md shadow-[#4CC9F0]/60">
                <h2 class="bg-[#F72585]/50 p-3 flex justify-center text-sm">
                    Mi Perfil
                </h2>

                <div class="bg-[#F72585]/70 p-2">

                    <label class="block mb-2" for="nombre">
                        Nombre Completo
                    </label>

                    <input
                        class="bg-[#F72585]/50 rounded-xl w-full p-2"
                        type="text"
                        id="nombre"
                        maxlength="100"
                    >
                    <p id="errorNombre"></p>

                </div>

                <div class="bg-[#F72585]/70 p-2">
                    <label class="block mb-2" for="fechaNacimiento">
                        Fecha de Nacimiento
                    </label>
                    <input
                        class="bg-[#F72585]/50 rounded-xl w-full p-2"
                        type="date"
                        id="fechaNacimiento"
                        disabled
                    >

                </div>

                <div class="bg-[#F72585]/70 p-2">
                    <label class="block mb-2" for="correo">
                        Correo Electrónico
                    </label>
                    <input
                        class="bg-[#F72585]/50 rounded-xl w-full p-2"
                        type="email"
                        id="correo"
                        disabled
                    >

                </div>
                <div class="bg-[#F72585]/70 p-2">
                    <label class="block mb-2" for="telefono">
                        Teléfono
                    </label>
                    <input
                        class="bg-[#F72585]/50 rounded-xl w-full p-2"
                        type="tel"
                        id="telefono"
                        placeholder="+56912345678"
                    >
                    <p id="errorTelefono"></p>
                </div>
                <div class="bg-[#F72585]/70 p-2">
                    <label class="block mb-2">
                        Beneficio
                    </label>
                    <div class="bg-[#F72585]/50 rounded-xl p-3">

                        <p id="descuento">
                            Cargando beneficio...
                        </p>
                    </div>
                </div>
                <div class="bg-[#F72585]/70 p-2">

                    <label class="block mb-2">
                        Géneros favoritos
                    </label>
                    <div class="bg-[#F72585]/50 rounded-xl w-full p-5 grid gap-5 grid-cols-3">
                        <label>
                            <input type="checkbox" name="genero" value="FICCION">
                            Ficción
                        </label>
                        <label>
                            <input type="checkbox" name="genero" value="NO FICCION">
                            No ficción
                        </label>
                        <label>
                            <input type="checkbox" name="genero" value="MISTERIO">
                            Misterio
                        </label>
                        <label>
                            <input type="checkbox" name="genero" value="TERROR">
                            Terror
                        </label>
                        <label>
                            <input type="checkbox" name="genero" value="SUSPENSO">
                            Suspenso
                        </label>
                        <label>
                            <input type="checkbox" name="genero" value="HISTORIA">
                            Historia
                        </label>
                    </div>
                    <p id="errorGenero"></p>
                </div>
                <button
                    class="bg-[#F72585]/70 p-3 w-full"
                    type="submit">

                    Guardar Cambios
                </button>
                <p id="mensajePerfil" class="p-3 text-center"></p>
            </form>
        </section>
    </div>
    <script src="Perfil.js"></script>
</body>
</html>
