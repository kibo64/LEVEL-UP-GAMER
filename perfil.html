<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - LEVEL-UP GAMER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {
            --font-press: "Press Start 2P", cursive;
            --font-exo: "Exo 2", sans-serif;
        }
    </style>
</head>

<body class="text-[#4CC9F0] font-exo bg-[#5A189A]">

    <div class="bg-[#3C096C] p-4 shadow-md shadow-[#4CC9F0]/20">
        <header class="max-w-[1200px] mx-auto flex justify-between items-center">
            <a href="index.html" class="text-white hover:text-[#F72585] font-bold text-sm transition-colors">
                Volver al Catálogo
            </a>
            <h1 class="text-[#F72585] font-press text-xl">
                LEVEL-UP GAMER
            </h1>
            <a href="login.html" class="bg-[#240046] rounded-xl shadow-sm shadow-[#4CC9F0]/50 px-4 py-2 text-sm text-[#4CC9F0] hover:shadow-[#4CC9F0] hover:shadow-md active:scale-95 transition-all duration-200">
                Cerrar sesión
            </a>
        </header>
    </div>

    <main class="max-w-[1200px] mx-auto p-4 mt-8 flex justify-center mb-12">
        <section class="w-full max-w-[600px]">
            <form id="perfilForm" class="bg-[#3C096C] rounded-2xl shadow-lg shadow-[#4CC9F0]/30 p-8 flex flex-col gap-4 border border-[#F72585]/20">
                
                <h2 class="text-[#F72585] font-press text-center text-lg mb-4">MI PERFIL</h2>

                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-bold tracking-wide" for="nombre">Nombre Completo</label>
                    <input class="bg-[#240046] border border-[#F72585]/40 text-white rounded-lg w-full p-3 focus:outline-none focus:border-[#4CC9F0] focus:ring-1 focus:ring-[#4CC9F0] transition-all"
                        type="text" id="nombre" maxlength="100">
                    <p id="errorNombre" class="text-red-400 text-xs min-h-[16px]"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-white/70 text-sm font-bold tracking-wide" for="fechaNacimiento">Fecha de Nacimiento</label>
                        <input class="bg-[#240046]/50 border border-transparent text-white/50 rounded-lg w-full p-3 cursor-not-allowed"
                            type="date" id="fechaNacimiento" disabled>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-white/70 text-sm font-bold tracking-wide" for="correo">Correo Electrónico</label>
                        <input class="bg-[#240046]/50 border border-transparent text-white/50 rounded-lg w-full p-3 cursor-not-allowed"
                            type="email" id="correo" disabled>
                    </div>
                </div>

                <div class="flex flex-col gap-1 mt-2">
                    <label class="text-white text-sm font-bold tracking-wide" for="telefono">Teléfono</label>
                    <input class="bg-[#240046] border border-[#F72585]/40 text-white rounded-lg w-full p-3 focus:outline-none focus:border-[#4CC9F0] focus:ring-1 focus:ring-[#4CC9F0] transition-all placeholder-white/30"
                        type="tel" id="telefono" placeholder="+56912345678">
                    <p id="errorTelefono" class="text-red-400 text-xs min-h-[16px]"></p>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-bold tracking-wide">Nivel de Beneficio</label>
                    <div class="bg-[#240046] border border-[#4CC9F0]/50 rounded-lg p-3 text-center shadow-inner">
                        <p id="descuento" class="text-[#4CC9F0] font-bold text-sm tracking-widest uppercase">
                            Cargando beneficio...
                        </p>
                    </div>
                </div>

                <div class="flex flex-col gap-1 mt-2">
                    <label class="text-white text-sm font-bold tracking-wide">Tus Géneros Favoritos</label>
                    <div class="bg-[#240046] border border-[#F72585]/40 rounded-lg p-4 grid grid-cols-2 md:grid-cols-3 gap-3">
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="RPG" class="accent-[#F72585] w-4 h-4"> RPG
                        </label>
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="SHOOTER" class="accent-[#F72585] w-4 h-4"> Shooter
                        </label>
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="DEPORTES" class="accent-[#F72585] w-4 h-4"> Deportes
                        </label>
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="ESTRATEGIA" class="accent-[#F72585] w-4 h-4"> Estrategia
                        </label>
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="AVENTURA" class="accent-[#F72585] w-4 h-4"> Aventura
                        </label>
                        <label class="flex items-center gap-2 text-sm text-white/80 cursor-pointer hover:text-white">
                            <input type="checkbox" name="genero" value="LUCHA" class="accent-[#F72585] w-4 h-4"> Lucha
                        </label>
                    </div>
                    <p id="errorGenero" class="text-red-400 text-xs min-h-[16px]"></p>
                </div>

                <button class="bg-[#F72585]/90 text-white font-bold rounded-lg p-3 w-full shadow-md shadow-[#F72585]/50 hover:bg-[#F72585] hover:shadow-lg hover:shadow-[#F72585]/80 active:scale-95 transition-all mt-4" type="submit">
                    Guardar Cambios
                </button>
                <p id="mensajePerfil" class="text-center text-sm min-h-[20px]"></p>

            </form>
        </section>
    </main>
    <script src="Perfil.js"></script>
</body>
</html>
