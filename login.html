<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL-UP GAMER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @import "tailwindcss";
        @import url('https://googleapis.com');
        @theme {
            --font-press: "Press Start 2P", cursive;
            --font-exo: "Exo 2", sans-serif;
        }
    </style>
</head>
<body class="text-[#4CC9F0] font-exo bg-[#5A189A]">
    <div class="bg-[#3C096C] p-4">
        <header class="flex justify-between items-center">
            <a href="index.html" class="text-white hover:text-[#F72585] font-bold text-sm transition-colors">
                Volver al Catálogo
            </a>
            <h1 class="text-[#F72585] font-press">LEVEL-UP GAMER</h1>
            <a href="registro.html" class="bg-[#240046] rounded-xl shadow-sm shadow-[#4CC9F0]/50 p-2 text-sm hover:shadow-[#4CC9F0] hover:shadow-md active:scale-98 transition-all duration-200">Registrarse</a>
        </header>
    </div>

    <div>
    <main class="max-w-[1200px] mx-auto p-4 mt-12 flex justify-center">
        <section class="w-full max-w-[450px]">
            <form id="loginForm" class="bg-[#3C096C] rounded-2xl shadow-lg shadow-[#4CC9F0]/30 p-8 flex flex-col gap-5 border border-[#F72585]/20">
                
                <h2 class="text-[#F72585] font-press text-center text-lg mb-4">INICIAR SESIÓN</h2>

                <div class="flex flex-col gap-2">
                    <label class="text-white text-sm font-bold tracking-wide" for="correo">Correo Electrónico</label>
                    <input class="bg-[#240046] border border-[#F72585]/40 text-white rounded-lg w-full p-3 focus:outline-none focus:border-[#4CC9F0] focus:ring-1 focus:ring-[#4CC9F0] transition-all placeholder-white/30"
                        type="email" 
                        id="correo"
                        placeholder="jugador@levelup.com"
                    >
                    <p id="errorCorreo" class="text-red-400 text-xs min-h-[16px]"></p>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white text-sm font-bold tracking-wide" for="contrasena">Contraseña</label>
                    <input class="bg-[#240046] border border-[#F72585]/40 text-white rounded-lg w-full p-3 focus:outline-none focus:border-[#4CC9F0] focus:ring-1 focus:ring-[#4CC9F0] transition-all placeholder-white/30"
                        type="password" 
                        id="contrasena"
                        placeholder="••••••••"
                    >
                    <p id="errorContrasena" class="text-red-400 text-xs min-h-[16px]"></p>
                </div>

                <button id="iniciarSesion" class="bg-[#F72585]/90 text-white font-bold rounded-lg p-3 w-full shadow-md shadow-[#F72585]/50 hover:bg-[#F72585] hover:shadow-lg hover:shadow-[#F72585]/80 active:scale-95 transition-all mt-2" type="submit">
                    Entrar al Sistema
                </button>

                <p id="mensajeLogin" class="text-center text-sm min-h-[20px] mt-2"></p>

            </form>
        </section>
    </main>
</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
